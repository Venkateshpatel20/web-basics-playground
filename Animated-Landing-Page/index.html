<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Animated Landing Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="main">
      <img src="assets/logo.png" alt="error" class="logo" />
      <button id="sign-up">Sign Up</button>
    </header>

    <main>
      <small id="heading">
        <span id="small-txt">Welcome to our </span>
     </small>
     <h1>
        World's <br>
        Creative Studio
      </h1>
      <button id="tour-btn">Take a tour</button>
    </main>
    
    <script>
      document
        .querySelector("#tour-btn")
        .addEventListener("click", function () {
          const section = document.getElementsByClassName("main");
          section[0].scrollIntoView({ behavior: "smooth" });
        });
    </script>
  </body>
</html>
